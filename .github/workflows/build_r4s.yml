name: Build R4S
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Get release tag
      id: release_tag
      run: |
        release_tag="OpenWrt-R4S-$(date +%Y-%m-%d)"
        echo "release_tag=${release_tag}" >> $GITHUB_OUTPUT

    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}

  build_openwrt:
    needs: prepare_release
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      MY_CPU: rk3399
      MY_VERSION: "25.12"
      MY_OPENWRT_TAG: "v25.12.4"

    steps:
    - name: Checkout
      uses: actions/checkout@main
 
    - name: Free disk space on Ubuntu runner
      uses: kfir4444/free-disk-space@main
      with:
        # frees about 6 GB, warning: may remove required tools
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -y update
        sudo apt-get install -y tzdata build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev python3-pyelftools rsync swig unzip zlib1g-dev file wget
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        git clone -b ${MY_OPENWRT_TAG} --depth=1 https://github.com/openwrt/openwrt.git openwrt

    - name: cache files
      uses: actions/cache@v5
      with:
        path: |
          project/openwrt/.ccache
        key: ${{ runner.os }}-buildcache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-buildcache-

    - name: Apply customizations
      run: |
        echo "======================="
        df -h .
        cd project
        source ../scripts/before_build_img.sh
        source ../scripts/add_packages.sh
        source ../scripts/custome_config.sh
        echo "======================="
        df -h ../

    - name: Prepare dot config and feeds
      run: |
        echo "======================="
        df -h .
        source ./scripts/prepare.sh
        echo "======================="
        df -h ../

    - name: Download package
      run: |
        cd project/openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "======================="
        df -h ../../

    - name: Compile openwrt
      id: compile
      continue-on-error: true
      run: |
        cd project/openwrt
        set +e
        timeout 340m make -j$(nproc)
        COMPILE_EXIT_CODE=$?
        set -e
        if [ $COMPILE_EXIT_CODE -eq 124 ]; then
          echo "::warning::suspend after compile for 300m."
          echo "::warning::manually trigger workflow to continue."
          echo "timeout=true" >> $GITHUB_OUTPUT
          exit 0
        elif [ $COMPILE_EXIT_CODE -ne 0 ]; then
          echo "::error::make finished with error try make -j1 V=s..."
          make -j1 V=s
          exit 1
        else
          echo "compile finished!!"
          echo "timeout=false" >> $GITHUB_OUTPUT
          echo "compile_success=true" >> $GITHUB_OUTPUT
        fi

    # - name: Check the result and try again
    #   if: steps.compile.outcome == 'failure'
    #   run: |
    #     cd project/openwrt
    #     make -j1 V=s

    - name: Create rootfs package
      if: steps.compile.outputs.compile_success == 'true'
      id: create_rootfs_package
      run: |
        cd project
        rootfs_filename="rootfs-openwrt-${MY_VERSION}.tgz"
        tar cvzf ../artifact/${rootfs_filename} openwrt/build_dir/target-aarch64_generic_musl/root-rockchip \
              openwrt/bin/targets/rockchip/armv8/packages
        echo "rootfs_filename=${rootfs_filename}" >> $GITHUB_OUTPUT

    - name: Upload openwrt img
      if: steps.compile.outputs.compile_success == 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./project/openwrt/bin/targets/*/*/*img.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
        file_glob: true

    - name: Upload rootfs package
      if: steps.compile.outputs.compile_success == 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
